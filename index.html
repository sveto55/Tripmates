<style>
:root{--bg:#F3F6FB;--card:#FFFFFF;--ink:#12202B;--mut:#5A6B85;--bd:#DCE4F1;--pri:#1D5FD1;--link:#1D5FD1;--navy:#0B2447;--amber:#F2A93B;--tint:#E3ECFB;--atint:#FDEBC8;--atext:#6B4300;--map:#E4ECF8;--road:#FFFFFF;--park:#DCEAE0;--danger:#A0281C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1626;--card:#12233B;--ink:#E8EEF8;--mut:#9DB0CD;--bd:#243A5A;--pri:#2F6FDE;--link:#8DB5F7;--navy:#08162B;--tint:#16305A;--atint:#4A3510;--atext:#F6CF8A;--map:#14243D;--road:#2A4064;--park:#17342C;--danger:#FF8A7A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1626;--card:#12233B;--ink:#E8EEF8;--mut:#9DB0CD;--bd:#243A5A;--pri:#2F6FDE;--link:#8DB5F7;--navy:#08162B;--tint:#16305A;--atint:#4A3510;--atext:#F6CF8A;--map:#14243D;--road:#2A4064;--park:#17342C;--danger:#FF8A7A;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
#app{height:100%}
.shell{height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:520px){.shell{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px;flex:none}
.hdr h1{font-size:20px;font-weight:800;margin:0;flex:1;min-width:0}
.ib{width:44px;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.dot{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--amber);color:#3A2600;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{flex:none;height:50px;border-radius:14px;background:var(--pri);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;width:100%;text-align:center;padding:0 12px}
.btn.o{background:none;border:1.5px solid var(--pri);color:var(--link)}
.btn.d{background:none;border:1.5px solid var(--danger);color:var(--danger)}
.btn.n{background:var(--navy);color:#fff;border:1px solid var(--bd)}
.btn.s{height:40px;border-radius:12px;font-size:14px;width:auto;flex:none}
.btn[disabled]{opacity:.6;cursor:default}
.mut{color:var(--mut);font-size:13px}
h2{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.4px;text-transform:uppercase;margin:6px 0 0}
.av{border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;background-size:cover;background-position:center}
.badge{background:var(--atint);color:var(--atext);font-weight:800;border-radius:12px;padding:5px 10px;flex:none}
.tag{background:var(--tint);color:var(--link);font-size:12px;font-weight:800;padding:4px 10px;border-radius:10px;flex:none}
.route{font-size:17px;font-weight:800;overflow-wrap:anywhere}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;height:48px;padding:0 12px;width:100%}
label{font-size:12px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;gap:6px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav{display:flex;border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);flex:none}
.nav button{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);text-align:center}
.nav button.on{color:var(--link)}
.toast{position:absolute;left:16px;right:16px;bottom:76px;background:var(--navy);color:#fff;padding:12px 14px;border-radius:12px;font-weight:700;text-align:center;z-index:6;border:1px solid var(--bd)}
.banner{position:absolute;left:12px;right:12px;top:10px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;z-index:7;box-shadow:0 6px 20px rgba(11,36,71,.25);display:flex;gap:12px;align-items:center;width:calc(100% - 24px)}
.seg{display:flex;gap:8px;flex:none}
.seg button{flex:1;height:44px;border-radius:12px;border:1.5px solid var(--bd);font-weight:700;text-align:center;background:var(--card)}
.seg button.on{background:var(--tint);border-color:var(--pri);color:var(--link)}
.map{flex:none;height:46%;min-height:250px;position:relative;background:var(--map)}
.map svg{width:100%;height:100%;display:block}
.sheet{flex:1;background:var(--card);border-radius:28px 28px 0 0;margin-top:-24px;position:relative;padding:14px 20px 20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;box-shadow:0 -2px 12px rgba(11,36,71,.15)}
.sw{width:48px;height:28px;border-radius:14px;background:var(--bd);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.sw.on{background:var(--pri)}.sw.on::after{left:23px}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--link);font-size:12px;font-weight:800;padding:5px 10px;border-radius:10px}
.live i{width:8px;height:8px;border-radius:4px;background:var(--pri);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
.tl{display:flex;gap:12px}.tl .rail{display:flex;flex-direction:column;align-items:center;width:14px}.tl .rail i{width:14px;height:14px;border-radius:7px;flex:none}.tl .rail u{width:3px;flex:1;min-height:30px;background:var(--bd)}
.welcome{align-items:stretch;padding-top:24px}
.bar{height:8px;border-radius:4px;background:var(--tint);overflow:hidden}.bar b{display:block;height:100%;background:var(--pri);width:0}
</style>
